[project]
name = "ai-document-v3-backend"
version = "0.1.0"
description = "AI Document V3 backend"
readme = "../README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "alembic",
  "pydantic-settings",
  "psycopg2-binary",
  "pydantic[email]",
  "python-jose[cryptography]",
  "passlib[bcrypt]",
  "bcrypt==4.0.1",
  "python-multipart",
  "pdfminer.six",
  "pdfplumber",
  "httpx",
  "faiss-cpu",
  "numpy",
  "pymupdf",
  "Pillow",
  "slowapi",
  # PaddleOCR / PaddlePaddle 版本鎖：
  # paddlepaddle 3.3.x 在 Windows CPU 上 PIR + onednn 新執行器有 regression
  # (ConvertPirAttribute2RuntimeAttribute not support [pir::ArrayAttribute<...>])，
  # 導致 PPStructureV3 layout 模型 predict 失敗。
  # 上游未修：https://github.com/PaddlePaddle/Paddle/issues/77340
  # 社群實測可用組合：paddlepaddle 3.2.2 + paddleocr 3.4.1
  "paddleocr==3.4.1",
  "paddlepaddle==3.2.2",
  # PPStructureV3 需要 paddlex[ocr] 的 extras (lxml / beautifulsoup4 / openpyxl /
  # scikit-learn / scipy / sentencepiece / tiktoken / einops 等)，否則 build pipeline
  # 會丟 DependencyError。
  "paddlex[ocr]==3.4.3",
  "google-generativeai",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
